[project]
name = "cafe-question-classifier"
version = "0.1.0"
description = "카페 추천 질문 유효성 검증 모델 파인튜닝"
requires-python = ">=3.10"
dependencies = [
    "torch==2.8.0+cu128",
    "transformers>=4.46.0",
    "accelerate>=1.1.0",
    "datasets>=3.0.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.2.2",
    "huggingface-hub>=0.26.0",
    "tqdm>=4.67.3",
    "numpy>=1.24.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }