model_name: "unsloth/Qwen2.5-7B-Instruct"
output_dir: "models/qwen-7b"
hf_repo: "east-right/cafe-keyword-selection-qwen-7b"

# LoRA
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# 학습
epochs: 3
batch_size: 4
grad_accum: 4
learning_rate: 2e-4
warmup_ratio: 0.05
max_seq_length: 2048
weight_decay: 0.01

# 양자화
load_in_4bit: true

# 저장
save_steps: 100
logging_steps: 10
