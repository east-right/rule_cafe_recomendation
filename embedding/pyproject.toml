[project]
name = "runpod-finetune"
version = "0.1.0"
description = "임베딩 모델 파인튜닝 전용 서브 환경(Runpod A40)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.8.0",
    "accelerate",
    "huggingface_hub",
    "sentencepiece",
    "numpy",
    "python-dotenv",
    "scikit-learn",
    "FlagEmbedding==1.3.3",
    "transformers==4.44.2",
    "peft==0.13.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }